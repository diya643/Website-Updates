<div class="frame">
  <section class="row cs-plug" aria-labelledby="csp-title">
    <a class="cs-plug-img" href="{{href}}" tabindex="-1" aria-hidden="true"><img src="/assets/photos/{{img}}-card.jpg" alt="" width="800" height="500" loading="lazy" decoding="async"></a>
    <div class="cs-plug-b">
      <span class="eyebrow">Customer success story</span>
      <h2 class="h3" id="csp-title">{{title}}</h2>
      <p>{{line}}</p>
      <p class="cs-plug-m">{{big}} {{tag}}</p>
      <div class="cs-plug-a"><a class="btn btn-dark btn-sm" href="{{href}}">Read the customer story</a><a class="link" href="/customer-stories">All customer stories</a></div>
    </div>
  </section>
</div>
